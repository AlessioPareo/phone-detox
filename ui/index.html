<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Detox</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dfe3ea;
  --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --ok-bg: #e8f6ed;
  --warn: #a16207; --warn-bg: #fdf6e3; --bad: #b91c1c; --bad-bg: #fdecec; --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
    --accent: #5b8def; --accent-text: #0b1020; --ok: #4ade80; --ok-bg: #16281d;
    --warn: #facc15; --warn-bg: #2b2613; --bad: #f87171; --bad-bg: #2d1717; --chip: #252c38;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; gap: 8px; padding: 12px 0; flex-wrap: wrap; }
.top h1 { font-size: 21px; margin: 0; flex: 1; }
.steps { display: flex; gap: 6px; padding: 0 0 12px; overflow-x: auto; }
.step { font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.step.on { background: var(--accent); color: var(--accent-text); }
.step.done { color: var(--ok); }
main { padding: 20px 0 130px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
h2 { margin: 0 0 12px; font-size: 23px; }
h3 { margin: 16px 0 8px; font-size: 18px; }
p { margin: 0 0 10px; }
ul, ol { margin: 0 0 10px; padding-left: 22px; }
li { margin-bottom: 5px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; word-break: break-all; }
button, .btn { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
button:hover, .btn:hover { border-color: var(--accent); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.big { font-size: 18px; padding: 13px 22px; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.link { border: none; background: none; color: var(--accent); padding: 6px; text-decoration: underline; }
button:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.box { border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.box.ok { background: var(--ok-bg); } .box.warn { background: var(--warn-bg); } .box.bad { background: var(--bad-bg); }
.box.info { background: var(--chip); }
.box > :last-child { margin-bottom: 0; }
input[type=text] { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  color: var(--text); width: 100%; max-width: 360px; }
label.check { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; cursor: pointer; }
label.check input { margin-top: 5px; width: 20px; height: 20px; flex: none; }
details { margin: 10px 0; } summary { cursor: pointer; color: var(--accent); }
pre { white-space: pre-wrap; word-break: break-word; background: var(--chip); padding: 10px; border-radius: 8px; max-height: 320px; overflow: auto; font-size: 13px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 10px 0; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
.tab { padding: 6px 12px; font-size: 15px; border-radius: 999px; }
.tab.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.app { display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.app:last-child { border-bottom: none; }
.app input { width: 22px; height: 22px; flex: none; }
.app .what { flex: 1; min-width: 0; }
.app .pkg { font-size: 12px; color: var(--muted); word-break: break-all; }
.app .why { font-size: 14px; color: var(--muted); }
.lock { width: 22px; text-align: center; flex: none; color: var(--muted); }
.badge { font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.via { color: var(--ok); } .badge.serve { color: var(--warn); } .badge.mai { color: var(--bad); }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--chip); border-radius: 10px; padding: 10px 14px; min-width: 130px; }
.stat b { display: block; font-size: 23px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); z-index: 6;
  box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
.bar .wrap { display: flex; gap: 10px; align-items: center; padding: 12px 16px; flex-wrap: wrap; }
.bar .count { flex: 1; min-width: 180px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.dialog { background: var(--card); border-radius: 14px; padding: 22px; max-width: 580px; width: 100%; max-height: 90vh; overflow: auto; }
.spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
  animation: spin 1s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
input[type=search] { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); width: 100%; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
@media (max-width: 560px) { .facts { grid-template-columns: 1fr; } .facts dd { margin-bottom: 6px; } body { font-size: 16px; } }
</style>
</head>

</header>
<main><div class="wrap" id="view"></div></main>

const S = {
  lang: "en", step: 0, env: null, devices: null, serial: null, kv: null, idForm: false, idError: "",
  infoStart: null, infoEnd: null, apps: null, selected: new Set(),
  tab: "via", search: "", expert: false, pending: null, groups: [], appsError: null,
};
try { S.lang = localStorage.getItem("pd:lang") || ""; } catch (e) {}
if (!T[S.lang]) S.lang = (navigator.language || "").toLowerCase().startsWith("it") ? "it" : "en";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
function t(key, params) {
  let v = key.split(".").reduce((o, k) => o && o[k], T[S.lang]);
  if (v === undefined) v = key.split(".").reduce((o, k) => o && o[k], T.en) ?? key;
  if (typeof v === "string" && params) v = v.replace(/\{(\w+)\}/g, (m, k) => k in params ? esc(params[k]) : m);
  return v;
}
function switchLang() { S.lang = S.lang === "it" ? "en" : "it"; try { localStorage.setItem("pd:lang", S.lang); } catch (e) {} render(); }

function save() {
  if (!S.serial) return;
  try { localStorage.setItem("pd:" + S.serial, JSON.stringify({ pending: S.pending, groups: S.groups, infoStart: S.infoStart })); } catch (e) {}
}
function load() {
  try { const d = JSON.parse(localStorage.getItem("pd:" + S.serial) || "null"); if (d) Object.assign(S, d); } catch (e) {}
}

class ApiError extends Error { constructor(code, params, detail) { super(code); this.code = code; this.params = params || {}; this.detail = detail || ""; } }
async function api(name, data = {}) {
  let r;
  try {
    r = await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN }, body: JSON.stringify(data) });
  } catch (e) { throw new ApiError("offline"); }
  let j; try { j = await r.json(); } catch (e) { throw new ApiError("offline"); }
  if (!r.ok) throw new ApiError(j.error || "unexpected", j.params, j.detail);
  return j;
}
const errText = e => e instanceof ApiError ? t("err." + e.code, e.params) : t("err.unexpected");
const errDetail = e => (e && e.detail) ? `<details><summary>${t("details")}</summary><pre>${esc(e.detail)}</pre></details>` : "";
function busy(msg) {
  $("modal").innerHTML = msg ? `<div class="overlay"><div class="dialog" style="text-align:center"><div class="spinner"></div><p>${esc(msg)}</p></div></div>` : "";
}
function dialog(html) { $("modal").innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeDialog() { $("modal").innerHTML = ""; }
const okBtn = (extra = "") => `<div class="row"><button class="primary" onclick="closeDialog();${extra}">${t("ok")}</button></div>`;
const detailsOf = out => out ? `<details><summary>${t("details")}</summary><pre>${esc(out)}</pre></details>` : "";
function showError(e, after = "") { dialog(`<h2>${t("err_title")}</h2><div class="box bad">${errText(e)}</div>${errDetail(e)}${okBtn(after)}`); }
async function withBusy(msg, fn) {
  busy(msg);
  try { const r = await fn(); busy(""); return r; }
  catch (e) { showError(e); throw e; }
}
const appName = a => a.name[S.lang] || a.name.it || a.package;
const nameOf = p => { const a = (S.apps || []).find(x => x.package === p); return a ? appName(a) : p; };
function go(step) { S.step = step; render(); window.scrollTo(0, 0); onEnter(); }

// Views
function render() {
  document.documentElement.lang = S.lang;
  $("langBtn").textContent = t("lang_switch");
  $("closeBtn").textContent = t("close");
  $("steps").innerHTML = t("steps").map((s, i) => `<span class="step ${i === S.step ? "on" : i < S.step ? "done" : ""}">${i < S.step ? "✓ " : (i + 1) + ". "}${s}</span>`).join("");
  $("view").innerHTML = [vStart, vConnect, vPhone, vApps, vEnd][S.step]();
  $("bar").innerHTML = S.step === 3 && S.apps && !S.pending ? vBar() : "";
}

function vStart() {
  return `<div class="card">
    <h2>${t("start_title")}</h2>
    <p>${t("start_intro")}</p>
    <p>${t("start_need")}</p>
    <div class="box warn">${t("start_risk")}</div>
    <p>${t("start_backup")}</p>
    <label class="check"><input type="checkbox" id="ack" onchange="$('go1').disabled=!this.checked"><span>${t("start_ack")}</span></label>
    <div class="row"><button class="primary big" id="go1" disabled onclick="go(1)">${t("next")}</button></div>
  </div>`;
}

function vConnect() {
  const e = S.env, d = S.devices;
  let status;
  if (!e) status = `<p class="muted">${t("conn_checking")}</p>`;
  else if (!e.sh) status = `<div class="box bad">${t("conn_no_sh")}
      <div class="row"><a class="btn primary" href="https://git-scm.com/download/win" target="_blank" rel="noopener">${t("conn_no_sh_btn")}</a></div></div>`;
  else if (!e.adb || (d && !d.adb)) {
    const manual = e.os === "windows" ? `${t("conn_adb_windows")}<br><span class="mono">${esc(e.root)}</span>` : t("conn_adb_" + e.os);
    status = `<div class="box warn">${t("conn_no_adb")}
      <div class="row"><button class="primary big" onclick="installAdb()">${t("conn_install_adb")}</button></div></div>
      <details><summary>${t("conn_adb_manual")}</summary><p class="small">${manual}</p>
      <button onclick="checkEnv()">${t("conn_recheck")}</button></details>`;
  }
  else if (!d) status = `<p class="muted">${t("conn_searching")}</p>`;
  else {
    const list = d.devices, ready = list.filter(x => x.state === "device");
    if (!list.length) status = `<div class="box info"><span class="dot"></span>${t("conn_none")}</div>${t("conn_debug")}`;
    else {
      status = list.map(x => {
        const st = x.state === "device" ? `<span class="dot ok"></span>${t("conn_ok")}`
          : x.state === "unauthorized" ? `<span class="dot warn"></span>${t("conn_wait")}`
          : x.state === "no-permissions" ? `<span class="dot bad"></span>${t("conn_noperm")}`
          : `<span class="dot bad"></span>${t("conn_bad", { state: x.state })}`;
        const pick = ready.length > 1 && x.state === "device"
          ? `<input type="radio" name="dev" ${S.serial === x.serial ? "checked" : ""} onchange="S.serial=this.value;render()" value="${esc(x.serial)}">` : "";
        return `<label class="app">${pick}<span class="what"><b>${esc(x.model || t("conn_phone"))}</b><div class="pkg">${esc(x.serial)}</div></span><span>${st}</span></label>`;
      }).join("");
      if (list.some(x => x.state === "unauthorized")) status += `<div class="box warn">${t("conn_unauth")}</div>`;
      if (list.some(x => x.state === "no-permissions")) status += `<div class="box bad">${t("conn_noperm_help")}</div>`;
      if (ready.length > 1) status += `<p class="small muted">${t("conn_many")}</p>`;
    }
  }
  const ready = d && d.devices.filter(x => x.state === "device");
  const can = !!(ready && ready.some(x => x.serial === S.serial));
  return `<div class="card"><h2>${t("conn_title")}</h2>${status}
    <div class="row"><button class="primary big" ${can ? "" : "disabled"} onclick="pickDevice()">${t("next")}</button><button onclick="go(0)">${t("back")}</button></div></div>
    ${e && e.adb && e.sh ? `<div class="card"><details id="wifi"><summary>${t("wifi_title")}</summary>
      <p class="small">${t("wifi_note")}</p>
      <ol class="small">${t("wifi_steps")}</ol>
      <div class="row"><input type="text" id="pairAddr" placeholder="192.168.1.20:37123"><input type="text" id="pairCode" placeholder="${esc(t("wifi_code"))}" style="max-width:170px"><button onclick="pair()">${t("wifi_pair")}</button></div>
      <p class="small" style="margin-top:12px">${t("wifi_step4")}</p>
      <div class="row" style="margin-top:0"><input type="text" id="connAddr" placeholder="192.168.1.20:41234"><button onclick="connectWifi()">${t("wifi_connect")}</button></div>
    </details></div>` : ""}`;
}

function vPhone() {
  const k = S.kv;
  if (!k) return `<div class="card"><h2>${t("phone_title")}</h2><p class="muted">${t("phone_reading")}</p></div>`;
  const name = [k.BRAND || k.MAKER, k.MARKET].filter(Boolean).join(" ") || k.MODEL;
  const facts = [["f_name", k.MARKET || t("unknown")], ["f_model", k.MODEL], ["f_system", `Android ${k.ANDROID}${k.SKIN ? ", " + k.SKIN : ""}`],
    ["f_storage", k.STORAGE], ["f_ram", k.RAM_MB ? k.RAM_MB + " MB" : ""], ["f_carrier", k.CARRIER]]
    .filter(f => f[1]).map(f => `<dt>${t(f[0])}</dt><dd>${esc(f[1])}</dd>`).join("");
  let body;
  if (k.CONFIDENCE === "confermato" && !S.idForm) {
    body = `<div class="box ok">${t("phone_confirmed", { name: k.MARKET })}</div>
      <div class="row"><button class="primary big" onclick="go(3)">${t("next")}</button><button onclick="S.idForm=true;render()">${t("phone_wrong")}</button></div>`;
  } else if (k.CONFIDENCE === "alta" && !S.idForm) {
    body = `<p>${t("phone_check", { name: k.MARKET, model: k.MODEL })}</p>
      <div class="row"><button class="primary big" onclick="confirmName(S.kv.MARKET)">${t("phone_yes")}</button><button onclick="S.idForm=true;render()">${t("phone_no")}</button></div>`;
  } else {
    body = `<div class="box warn">${t("phone_unsure")}</div>
      <p><label>${t("phone_name")}<br><input type="text" id="idName" value="${esc(k.MARKET)}" placeholder="Galaxy A54 5G"></label></p>
      <p><label>${t("phone_model")}<br><input type="text" id="idModel" placeholder="${esc(k.MODEL)}"></label></p>
      ${S.idError ? `<div class="box bad">${S.idError}</div>` : ""}
      <div class="row"><button class="primary big" onclick="confirmForm()">${t("phone_confirm")}</button></div>`;
  }
  return `<div class="card"><h2>${t("phone_title")}</h2><p style="font-size:21px;margin-bottom:4px"><b>${esc(name)}</b></p>
    <dl class="facts">${facts}</dl>${body}
    <div class="row"><button onclick="go(1)">${t("back")}</button></div></div>`;
}

const TAB_IDS = ["via", "serve", "tua", "dubbio", "mai", "spente"];
const inTab = (a, id) => id === "spente" ? a.state !== "on" : (a.verdict === id && a.state === "on");

function vApps() {
  const i = S.infoStart;
  const nVia = S.apps ? S.apps.filter(a => inTab(a, "via")).length : "…";
  const head = `<div class="card"><h2>${t("apps_title")}</h2>
    ${i ? `<div class="stats"><div class="stat"><span class="small muted">${t("ram_now")}</span><b>${i.ram_free ?? "?"} MB</b></div>
      <div class="stat"><span class="small muted">${t("recommended")}</span><b>${nVia}</b></div>
      <div class="stat"><span class="small muted">${t("groups_done")}</span><b>${S.groups.filter(g => g.ok).length}</b></div></div>` : ""}
    ${i && i.managed ? `<div class="box bad">${t("managed")}</div>` : ""}
    ${!S.pending ? `<details ${S.groups.length ? "" : "open"}><summary>${t("how_title")}</summary>${t("how_text")}</details>` : ""}
  </div>`;
  if (S.pending) return head + vTest();
  if (S.appsError) return head + `<div class="card"><div class="box bad">${errText(S.appsError)}</div>${errDetail(S.appsError)}<div class="row"><button onclick="loadApps()">${t("retry")}</button></div></div>`;
  if (!S.apps) return head + `<div class="card"><p class="muted">${t("apps_reading")}</p></div>`;

  const q = S.search.trim().toLowerCase();
  const list = S.apps.filter(a => inTab(a, S.tab)).filter(a => !q || (appName(a) + " " + a.package).toLowerCase().includes(q));
  const tabs = TAB_IDS.map(id => `<button class="tab ${S.tab === id ? "on" : ""}" onclick="S.tab='${id}';render()">${t("tabs." + id)} (${S.apps.filter(a => inTab(a, id)).length})</button>`).join("");
  const rows = list.map(a => {
    const reason = a.reason ? `<div class="why">${esc(a.reason[S.lang] || a.reason.it)}</div>` : "";
    const nm = `<span class="what"><b>${esc(appName(a))}</b>${reason}<div class="pkg">${esc(a.package)}</div></span>`;
    if (a.state !== "on")
      return `<div class="app"><span class="lock">⏻</span>${nm}<span class="badge">${t(a.state === "off" ? "st_off" : "st_removed")}</span>
        <button onclick="restoreOne('${esc(a.package)}')">${t("turn_on")}</button></div>`;
    if (a.verdict === "mai") return `<div class="app"><span class="lock" title="${esc(t("lock_title"))}">🔒</span>${nm}</div>`;
    const full = S.selected.size >= 10 && !S.selected.has(a.package);
    const why = a.verdict === "dubbio" && !S.expert ? t("why_dubbio") : full ? t("why_full") : "";
    return `<label class="app" ${why ? `title="${esc(why)}"` : ""}><input type="checkbox" ${S.selected.has(a.package) ? "checked" : ""} ${why ? "disabled" : ""}
      onchange="toggle('${esc(a.package)}', this.checked)">${nm}<span class="badge ${a.verdict}">${t("badges." + a.verdict)}</span></label>`;
  }).join("") || `<p class="muted">${t("none_here")}</p>`;
  return head + `<div class="card">
    <div class="tabs">${tabs}</div>
    <p class="small">${t("tab_help." + S.tab)}</p>
    ${S.tab === "via" ? `<div class="row" style="margin:4px 0 12px"><button onclick="pickForMe()">✨ ${t("pick_for_me")}</button></div>` : ""}
    ${S.tab === "dubbio" ? `<label class="check small"><input type="checkbox" ${S.expert ? "checked" : ""} onchange="S.expert=this.checked;render()"><span>${t("expert")}</span></label>` : ""}
    ${S.selected.size >= 10 ? `<div class="box info">${t("full_box")}</div>` : ""}
    <input type="search" placeholder="${esc(t("search"))}" value="${esc(S.search)}" oninput="S.search=this.value;renderKeepFocus()">
    <div style="margin-top:8px">${rows}</div></div>
    <div class="card"><h3 style="margin-top:0">${t("done_title")}</h3><p class="small">${t("done_text")}</p>
      <div class="row"><button onclick="go(4)">${t("done_btn")}</button></div></div>`;
}

function renderKeepFocus() {
  const pos = document.activeElement && document.activeElement.selectionStart;
  render();
  const el = document.querySelector("input[type=search]");
  if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
}

function vBar() {
  const n = S.selected.size, names = [...S.selected].map(nameOf);
  return `<div class="bar"><div class="wrap"><span class="count">${t("bar_count", { n })}${n ? ": " + esc(names.slice(0, 3).join(", ")) + (n > 3 ? "…" : "") : ""}</span>
    <button ${n ? "" : "disabled"} onclick="S.selected.clear();render()">${t("clear")}</button>
    <button class="primary big" ${n ? "" : "disabled"} onclick="askDisable()">${t("turn_off_group")}</button></div></div>`;
}

function vTest() {
  const p = S.pending, names = p.packages.map(nameOf);
  if (p.failed && p.failed.length && !p.failedHandled) {
    return `<div class="card"><h2>${t("failed_title")}</h2>
      <p>${t("failed_text")}</p><ul>${p.failed.map(x => `<li>${esc(nameOf(x))}</li>`).join("")}</ul>
      <div class="box info">${t("failed_offer")}</div>
      <div class="row"><button class="primary" onclick="uninstallFailed()">${t("failed_remove")}</button><button onclick="S.pending.failedHandled=true;save();render()">${t("failed_leave")}</button></div></div>`;
  }
  if (!p.rebooted) {
    return `<div class="card"><h2>${t("reboot_title")}</h2>
      <p>${t("reboot_text", { n: names.length, list: names.join(", ") })}</p>
      <p>${t("reboot_why")}</p>
      <div class="row"><button class="primary big" onclick="reboot()">${t("reboot_btn")}</button><button onclick="S.pending.rebooted=true;save();render()">${t("reboot_self")}</button></div>
      ${detailsOf(p.output)}</div>`;
  }
  return `<div class="card"><h2>${t("test_title")}</h2>
    <p>${t("test_intro")}</p>
    ${t("tests").map(x => `<label class="check"><input type="checkbox"><span>${esc(x)}</span></label>`).join("")}
    <div class="row"><button class="primary big" onclick="groupOk()">${t("test_ok")}</button>
      <button class="danger" onclick="groupBad()">${t("test_bad")}</button></div>
    <p class="small muted" style="margin-top:10px">${t("test_group", { list: names.join(", ") })}</p></div>`;
}

function vEnd() {
  const a = S.infoStart, b = S.infoEnd;
  const done = S.groups.filter(g => g.ok).flatMap(g => g.packages);
  return `<div class="card"><h2>${t("end_title")}</h2>
    ${b ? `<div class="stats"><div class="stat"><span class="small muted">${t("ram_before")}</span><b>${a && a.ram_free ? a.ram_free + " MB" : "?"}</b></div>
      <div class="stat"><span class="small muted">${t("ram_now")}</span><b>${b.ram_free ?? "?"} MB</b></div>
      <div class="stat"><span class="small muted">${t("apps_off")}</span><b>${done.length}</b></div></div>
      <p class="small muted" style="margin-top:8px">${t("ram_note")}</p>` : `<p class="muted">${t("phone_reading")}</p>`}
    ${done.length ? `<details><summary>${t("end_list")}</summary><ul class="small">${done.map(p => `<li>${esc(nameOf(p))}</li>`).join("")}</ul></details>` : ""}
    <div class="box warn">${t("end_debug")}</div>
  </div>
  <div class="card"><h3 style="margin-top:0">${t("later_title")}</h3>
    <p class="small">${t("later_list", { path: S.env ? S.env.changes : "changes" })}</p>
    <p class="small">${t("later_update")}</p>
    <div class="row"><button onclick="check(false)">${t("check")}</button><button onclick="check(true)">${t("check_fix")}</button></div>
    <h3>${t("trouble")}</h3>
    <div class="row" style="margin-top:0"><button class="danger" onclick="undoAll(false)">${t("undo_all")}</button>
      <button class="danger" onclick="undoAll(true)">${t("rescue")}</button></div>
    <div class="row"><button onclick="go(3)">${t("back_to_apps")}</button><button class="primary big" onclick="askQuit()">${t("quit")}</button></div>
  </div>`;
}

// ---------------------------------------------------------------------------------------------
// Actions
let pollTimer = null;
async function onEnter() {
  clearInterval(pollTimer);
  if (S.step === 1) { await checkEnv(); pollTimer = setInterval(pollDevices, 2500); }
  if (S.step === 2) {
    S.kv = null; S.idForm = false; S.idError = ""; render();
    try { S.kv = await api("identify", { serial: S.serial }); render(); }
    catch (e) { showError(e, "go(1)"); }
  }
  if (S.step === 3) {
    load(); render();
    if (!S.infoStart) {
      try { S.infoStart = await api("info", { serial: S.serial }); save(); render(); }
      catch (e) { S.appsError = e; render(); return; }
    }
    if (!S.apps) loadApps();
  }
  if (S.step === 4) {
    if (!S.env) try { S.env = await api("env"); } catch (e) {}
    S.infoEnd = null; render();
    try { S.infoEnd = await api("info", { serial: S.serial }); render(); } catch (e) { showError(e); }
  }
}
async function checkEnv() { try { S.env = await api("env"); } catch (e) {} render(); await pollDevices(); }
let polling = false;
async function pollDevices() {
  if (polling || S.step !== 1 || !S.env || !S.env.adb || !S.env.sh) return;
  polling = true;
  try {
    const before = JSON.stringify([S.devices, S.serial]);
    S.devices = await api("devices");
    const ready = S.devices.devices.filter(x => x.state === "device");
    if (!ready.some(x => x.serial === S.serial)) S.serial = ready.length === 1 ? ready[0].serial : null;
    // Redraw only when something changed, so the Wi-Fi section doesn't close while typing.
    if (JSON.stringify([S.devices, S.serial]) !== before && !document.querySelector("#view input[type=text]:focus")) {
      const open = $("wifi")?.open;
      render();
      if (open && $("wifi")) $("wifi").open = true;
    }
  } catch (e) {} finally { polling = false; }
}
async function installAdb() {
  try { await withBusy(t("conn_installing"), () => api("install_adb")); } catch (e) { return; }
  await checkEnv();
}
function pickDevice() { S.apps = null; S.infoStart = null; S.groups = []; S.pending = null; S.selected.clear(); S.appsError = null; go(2); }
async function pair() {
  let r; try { r = await withBusy(t("wifi_pairing"), () => api("pair", { address: $("pairAddr").value.trim(), code: $("pairCode").value.trim() })); } catch (e) { return; }
  dialog(`<h2>${t(r.ok ? "wifi_paired" : "wifi_failed")}</h2><p>${t(r.ok ? "wifi_paired_text" : "wifi_failed_text")}</p>${detailsOf(r.output)}${okBtn()}`);
}
async function connectWifi() {
  let r; try { r = await withBusy(t("wifi_connecting"), () => api("connect", { address: $("connAddr").value.trim() })); } catch (e) { return; }
  if (!r.ok) dialog(`<h2>${t("wifi_failed")}</h2>${detailsOf(r.output)}${okBtn()}`);
  pollDevices();
}
async function confirmName(name) {
  try { await withBusy(t("saving"), () => api("confirm", { serial: S.serial, name })); } catch (e) { return; }
  go(3);
}
async function confirmForm() {
  const name = $("idName").value.trim(), model = $("idModel").value.trim();
  const norm = s => s.toUpperCase().replace(/[\s_-]/g, "");
  if (!name || !model) { S.idError = t("phone_both"); return render(); }
  if (norm(model) !== norm(S.kv.MODEL)) { S.idError = t("phone_mismatch", { typed: model, model: S.kv.MODEL }); return render(); }
  S.idError = ""; await confirmName(name);
}
async function loadApps() {
  S.appsError = null; S.apps = null; render();
  try {
    S.apps = (await api("apps", { serial: S.serial })).apps;
    for (const p of [...S.selected]) { const a = S.apps.find(x => x.package === p); if (!a || a.state !== "on" || a.verdict === "mai") S.selected.delete(p); }
  } catch (e) { S.appsError = e; }
  render();
}
function toggle(p, on) { if (on && S.selected.size < 10) S.selected.add(p); else S.selected.delete(p); render(); }
function pickForMe() {
  const via = S.apps.filter(a => inTab(a, "via")).map(a => a.package);
  const order = [...SAFE_ORDER.filter(p => via.includes(p)), ...via.filter(p => !SAFE_ORDER.includes(p))];
  const before = S.selected.size;
  for (const p of order) { if (S.selected.size >= 10) break; S.selected.add(p); }
  if (S.selected.size === before && before < 10) dialog(`<p>${t("nothing_to_pick")}</p>${okBtn()}`);
  render();
}
function askDisable() {
  const chosen = [...S.selected].map(p => S.apps.find(x => x.package === p)).filter(Boolean);
  const risky = chosen.filter(a => a.verdict !== "via").map(appName);
  dialog(`<h2>${t("confirm_title", { n: chosen.length })}</h2>
    <ul>${chosen.map(a => `<li><b>${esc(appName(a))}</b> <span class="badge ${a.verdict}">${t("badges." + a.verdict)}</span></li>`).join("")}</ul>
    ${risky.length ? `<div class="box warn">${t("confirm_warn", { list: risky.join(", ") })}</div>` : ""}
    <p class="small">${t("confirm_text")}</p>
    <div class="row"><button class="primary big" onclick="doDisable()">${t("confirm_yes")}</button><button onclick="closeDialog()">${t("cancel")}</button></div>`);
}
async function doDisable() {
  const pkgs = [...S.selected];
  let r; try { r = await withBusy(t("turning_off"), () => api("disable", { serial: S.serial, packages: pkgs })); } catch (e) { return; }
  S.selected.clear();
  const changed = [...r.off, ...r.removed];
  if (!changed.length && !r.failed.length) {
    dialog(`<h2>${t("nothing_changed")}</h2><p>${t("nothing_changed_text")}</p>${detailsOf(r.output)}${okBtn()}`);
    return loadApps();
  }
  S.pending = { packages: changed, failed: r.failed, output: r.output, rebooted: false };
  save(); render(); window.scrollTo(0, 0);
}
async function uninstallFailed() {
  let r; try { r = await withBusy(t("removing"), () => api("disable", { serial: S.serial, packages: S.pending.failed, uninstall: true })); } catch (e) { return; }
  S.pending.packages.push(...r.off, ...r.removed);
  S.pending.output += "\n" + r.output; S.pending.failedHandled = true;
  if (!S.pending.packages.length) { S.pending = null; dialog(`<h2>${t("failed_again")}</h2>${detailsOf(r.output)}${okBtn()}`); loadApps(); }
  save(); render();
}
async function reboot() {
  let r; try { r = await withBusy(t("rebooting"), () => api("reboot", { serial: S.serial })); } catch (e) { return false; }
  if (!r.ok) dialog(`<h2>${t("reboot_slow_title")}</h2><p>${t("reboot_slow")}</p>${okBtn()}`);
  if (S.pending) { S.pending.rebooted = true; save(); render(); }
  return true;
}
function groupOk() { S.groups.push({ packages: S.pending.packages, ok: true }); S.pending = null; save(); loadApps(); window.scrollTo(0, 0); }
async function groupBad() {
  let r; try { r = await withBusy(t("undoing_group"), () => api("undo", { serial: S.serial, packages: S.pending.packages })); } catch (e) { return; }
  S.groups.push({ packages: S.pending.packages, ok: false }); S.pending = null; save();
  dialog(`<h2>${t(r.rc === 0 ? "group_back" : "group_partial")}</h2><p>${t("group_back_text")}</p>${detailsOf(r.output)}
    <div class="row"><button class="primary" onclick="closeDialog();rebootPlain()">${t("reboot_btn")}</button><button onclick="closeDialog()">${t("reboot_later")}</button></div>`);
  loadApps();
}
async function rebootPlain() { if (await reboot()) loadApps(); }
async function restoreOne(p) {
  let r; try { r = await withBusy(t("turning_on"), () => api("undo", { serial: S.serial, packages: [p] })); } catch (e) { return; }
  const ok = r.restored.includes(p);
  dialog(`<h2>${t(ok ? "restored" : "not_restored")}</h2><p>${ok ? t("restored_text", { name: nameOf(p) }) : t("not_restored_text")}</p>${detailsOf(r.output)}${okBtn()}`);
  loadApps();
}
async function check(fix) {
  let r; try { r = await withBusy(t(fix ? "fixing" : "checking"), () => api("check", { serial: S.serial, fix })); } catch (e) { return; }
  const msg = r.empty ? t("check_empty") : r.fixed ? t("check_fixed", { n: r.fixed }) : r.changed ? t("check_changed", { n: r.changed }) : t("check_ok");
  dialog(`<h2>${t(r.rc === 0 || r.empty ? "check_ok" : "err_title")}</h2><p>${msg}</p>${detailsOf(r.output)}${okBtn()}`);
}
function undoAll(all) {
  dialog(`<h2>${t(all ? "rescue" : "undo_all")}</h2><p>${t(all ? "rescue_text" : "undo_all_text")}</p>
    <div class="row"><button class="danger" onclick="closeDialog();doUndoAll(${all})">${t("undo_yes")}</button><button onclick="closeDialog()">${t("cancel")}</button></div>`);
}
async function doUndoAll(all) {
  let r; try { r = await withBusy(t("turning_on"), () => api("undo", { serial: S.serial, all })); } catch (e) { return; }
  S.groups = []; S.pending = null; S.apps = null; save();
  dialog(`<h2>${t("undone")}</h2><p>${t("undone_text")}</p>${detailsOf(r.output)}
    <div class="row"><button class="primary" onclick="closeDialog();rebootPlain()">${t("reboot_btn")}</button><button onclick="closeDialog()">${t("reboot_later")}</button></div>`);
}
function askQuit() {
  dialog(`<h2>${t("quit_q")}</h2><p>${t("quit_text")}</p>
    <div class="row"><button class="primary" onclick="quitApp()">${t("quit")}</button><button onclick="closeDialog()">${t("cancel")}</button></div>`);
}
async function quitApp() {
  try { await api("quit"); } catch (e) {}
  clearInterval(pollTimer);
  document.body.innerHTML = `<main><div class="wrap"><div class="card"><h2>${t("closed_title")}</h2><p>${t("closed_text")}</p>
    <div class="box warn">${t("closed_debug")}</div></div></div></main>`;
}

render();
</script>
</body>
</html>
